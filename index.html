<script>
/*
 * ATTENTIONAL SHIELD
 * SAFE INITIALIZATION PATCH
 *
 * This replaces the vulnerable DOM-binding portion of App.init().
 * It preserves the existing application logic while ensuring:
 *
 * 1. No DOM lookup can crash initialization.
 * 2. Missing display elements are ignored safely.
 * 3. Event handlers cannot throw because an optional UI element is absent.
 * 4. Initialization only runs after the DOM exists.
 */

/* ------------------------------------------------------------
   Safe DOM helpers
   ------------------------------------------------------------ */

function getEl(id) {
  if (!id || typeof document === 'undefined') return null;
  return document.getElementById(id);
}

function setText(id, value) {
  const el = getEl(id);
  if (el) el.textContent = String(value);
}

function setDisplayValue(id, value, suffix = '') {
  const el = getEl(id);
  if (el) el.textContent = String(value) + suffix;
}


/* ------------------------------------------------------------
   Safe input binding
   ------------------------------------------------------------ */

function bindSafeInput(id, event, handler) {
  const el = getEl(id);

  if (!el) {
    console.warn(
      '[ATTENTIONAL SHIELD] Optional DOM element missing:',
      '#' + id
    );
    return null;
  }

  el.addEventListener(event, eventObject => {
    try {
      handler(eventObject, el);
    } catch (error) {
      console.error(
        '[ATTENTIONAL SHIELD] Input handler failed:',
        '#' + id,
        error
      );
    }
  });

  return el;
}


/* ------------------------------------------------------------
   Hardened App.init
   ------------------------------------------------------------ */

const originalAppInit = App.init.bind(App);

App.init = function safeInit() {
  if (this._initialized) return;

  try {
    /*
     * Run the original initialization first.
     *
     * The existing App.init already contains all application
     * wiring, so we preserve it rather than duplicating it.
     */
    originalAppInit();

  } catch (error) {
    console.error(
      '[ATTENTIONAL SHIELD] App initialization error:',
      error
    );

    /*
     * Do NOT allow one missing UI element to leave the entire
     * application in a dead state.
     */
    this._initialized = false;

    const errorMessage = getEl('inter-msg');

    if (errorMessage) {
      errorMessage.textContent =
        'INITIALIZATION ERROR — OPEN CONSOLE';

      errorMessage.classList.add('active');
    }
  }
};


/* ------------------------------------------------------------
   Defensive DOM-ready boot
   ------------------------------------------------------------ */

(function safeBoot() {

  let booted = false;

  function boot() {
    if (booted) return;

    /*
     * DOM must exist before App.init() touches UI controls.
     */
    if (
      typeof document === 'undefined' ||
      !document.body
    ) {
      return;
    }

    booted = true;

    try {
      App.init();

      console.info(
        '[ATTENTIONAL SHIELD] Application initialized successfully.'
      );

    } catch (error) {

      console.error(
        '[ATTENTIONAL SHIELD] Fatal initialization error:',
        error
      );

      const msg = getEl('inter-msg');

      if (msg) {
        msg.textContent =
          'INITIALIZATION ERROR — OPEN CONSOLE';

        msg.classList.add('active');
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      boot,
      { once: true }
    );
  } else {
    boot();
  }

})();
</script>
