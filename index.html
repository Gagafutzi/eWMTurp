<script>
/* ============================================================
   ATTENTIONAL SHIELD — ANIME WEBP ASSET PIPELINE
   Actual repository assets:
   assets/stimuli/anime/a.webp ... l.webp
   ============================================================ */

const ANIME_FACE_ASSET_MANIFEST = Object.freeze({
  standard: Object.freeze([
    'assets/stimuli/anime/a.webp',
    'assets/stimuli/anime/b.webp',
    'assets/stimuli/anime/c.webp',
    'assets/stimuli/anime/d.webp',
    'assets/stimuli/anime/e.webp',
    'assets/stimuli/anime/f.webp',
    'assets/stimuli/anime/g.webp',
    'assets/stimuli/anime/h.webp',
    'assets/stimuli/anime/i.webp',
    'assets/stimuli/anime/j.webp',
    'assets/stimuli/anime/k.webp',
    'assets/stimuli/anime/l.webp'
  ]),

  waifu: Object.freeze([]),
  hentai: Object.freeze([]),
  gore: Object.freeze([])
});

const ANIME_MODES = Object.freeze([
  'standard',
  'waifu',
  'hentai',
  'gore'
]);

const FACE_IMAGE_CACHE = Object.create(null);
const ANIME_IMAGE_CACHE = Object.create(null);

/* Explicitly initialize every cache bucket. */
ANIME_MODES.forEach(mode => {
  ANIME_IMAGE_CACHE[mode] = Object.create(null);
});


/* ============================================================
   VERIFIED IMAGE PRELOADER
   ============================================================ */

function preloadImage(path, targetCache) {
  return new Promise(resolve => {

    if (!path || !targetCache) {
      resolve(false);
      return;
    }

    const existing = targetCache[path];

    /* Already successfully loaded. */
    if (
      existing instanceof HTMLImageElement &&
      existing.complete &&
      existing.naturalWidth > 0 &&
      existing.naturalHeight > 0
    ) {
      resolve(true);
      return;
    }

    /* Never retain stale/broken entries. */
    delete targetCache[path];

    const img = new Image();

    img.decoding = 'async';
    img.loading = 'eager';

    let settled = false;

    const fail = reason => {
      if (settled) return;

      settled = true;
      delete targetCache[path];

      console.error(
        '[ATTENTIONAL SHIELD] Failed to load image:',
        path,
        reason || ''
      );

      resolve(false);
    };

    img.onerror = () => {
      fail('load error');
    };

    img.onload = async () => {

      /*
       * Browser successfully fired load, but verify that an actual
       * image was decoded and has non-zero dimensions.
       */
      if (
        img.naturalWidth <= 0 ||
        img.naturalHeight <= 0
      ) {
        fail('zero natural dimensions');
        return;
      }

      /*
       * Explicitly decode WebP before putting it into the cache.
       */
      if (typeof img.decode === 'function') {
        try {
          await img.decode();
        } catch (error) {
          fail(error);
          return;
        }
      }

      if (
        img.naturalWidth <= 0 ||
        img.naturalHeight <= 0
      ) {
        fail('zero dimensions after decode');
        return;
      }

      if (settled) return;

      settled = true;

      /*
       * ONLY successfully decoded images enter the cache.
       */
      targetCache[path] = img;

      resolve(true);
    };

    /*
     * Exact repository path.
     *
     * Do not transform this path into PNG/JPG or strip the directory.
     */
    img.src = path;
  });
}


/* ============================================================
   VERIFIED ANIME CACHE LOOKUP
   ============================================================ */

function getCachedAnimePaths(mode = 'standard') {

  const safeMode =
    ANIME_MODES.includes(mode)
      ? mode
      : 'standard';

  const cache =
    ANIME_IMAGE_CACHE[safeMode] ||
    Object.create(null);

  const manifest =
    ANIME_FACE_ASSET_MANIFEST[safeMode] ||
    [];

  return manifest.filter(path => {

    const img = cache[path];

    return (
      img instanceof HTMLImageElement &&
      img.complete &&
      img.naturalWidth > 0 &&
      img.naturalHeight > 0
    );
  });
}


/* ============================================================
   HUMAN FACE PRELOAD
   ============================================================ */

const FACE_PRELOAD_PROMISE = Promise.all(
  FACES.map(face =>
    preloadImage(
      face.file,
      FACE_IMAGE_CACHE
    )
  )
);


/* ============================================================
   UNIFIED ANIME PRELOAD GATE
   ============================================================ */

const ANIME_PRELOAD_READY = Promise.all(

  ANIME_MODES.map(async mode => {

    const paths =
      ANIME_FACE_ASSET_MANIFEST[mode] ||
      [];

    if (!ANIME_IMAGE_CACHE[mode]) {
      ANIME_IMAGE_CACHE[mode] =
        Object.create(null);
    }

    const results = await Promise.all(
      paths.map(path =>
        preloadImage(
          path,
          ANIME_IMAGE_CACHE[mode]
        )
      )
    );

    const loaded =
      results.filter(Boolean).length;

    console.info(
      `[ATTENTIONAL SHIELD] Anime ${mode}: ${loaded}/${paths.length} images loaded.`
    );

    return {
      mode,
      loaded
    };
  })

).catch(error => {

  console.error(
    '[ATTENTIONAL SHIELD] Anime preload pipeline failed:',
    error
  );

  ANIME_MODES.forEach(mode => {
    if (!ANIME_IMAGE_CACHE[mode]) {
      ANIME_IMAGE_CACHE[mode] =
        Object.create(null);
    }
  });

  return [];
});


/* ============================================================
   COMPATIBILITY PROMISES
   ============================================================ */

const ANIME_FACE_PRELOAD_PROMISES =
  Object.fromEntries(

    ANIME_MODES.map(mode => [

      mode,

      ANIME_PRELOAD_READY.then(() =>
        getCachedAnimePaths(mode)
      )

    ])

  );


/* ============================================================
   SAFE ANIME SELECTION
   ============================================================ */

function pickAnimeFace(mode = 'standard') {

  const available =
    getCachedAnimePaths(mode);

  if (!available.length) {

    console.warn(
      '[ATTENTIONAL SHIELD] No verified Anime WebP assets are cached.'
    );

    return null;
  }

  return available[
    Math.floor(
      Math.random() * available.length
    )
  ];
}
