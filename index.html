  const FACE_IMAGE_CACHE = Object.create(null);

  ANIME_MODES.forEach(function (mode) {

  /*
   * Image preload is deliberately non-fatal.
   *
   * A failed asset:
   *   - never enters the cache
   *   - resolves false
   *   - cannot produce a broken <img>
   */
  function preloadImage(path, targetCache) {
    return new Promise(function (resolve) {
      if (!path || !targetCache) {
        resolve(false);
        return;
      }

      const existing = targetCache[path];

      if (
        existing instanceof HTMLImageElement &&
        existing.complete &&
        existing.naturalWidth > 0 &&
        existing.naturalHeight > 0
      ) {
        resolve(true);
        return;
      }

      delete targetCache[path];

      const img = new Image();

      img.decoding = 'async';
      img.loading = 'eager';

      let settled = false;

      function fail(reason) {
        if (settled) return;

        settled = true;

        delete targetCache[path];

        console.error(
          '[ATTENTIONAL SHIELD] Failed to load image:',
          path,
          reason || ''
        );

        resolve(false);
      }

      img.onerror = function () {
        fail('load error');
      };

      img.onload = async function () {
        if (
          img.naturalWidth <= 0 ||
          img.naturalHeight <= 0
        ) {
          fail('zero natural dimensions');
          return;
        }

        if (typeof img.decode === 'function') {
          try {
            await img.decode();
          } catch (error) {
            fail(error);
            return;
          }
        }

        if (
          img.naturalWidth <= 0 ||
          img.naturalHeight <= 0
        ) {
          fail('zero dimensions after decode');
          return;
        }

        if (settled) return;

        settled = true;

        targetCache[path] = img;

        resolve(true);
      };

      img.src = path;
    });
  }

  function getCachedAnimePaths(mode) {
    const safeMode =
      ANIME_MODES.includes(mode)
        ? mode
        : 'standard';

    const cache =
      ANIME_IMAGE_CACHE[safeMode] ||
      Object.create(null);

    const manifest =
      ANIME_FACE_ASSET_MANIFEST[safeMode] ||
      [];

    return manifest.filter(function (path) {
      const img = cache[path];

      return (
        img instanceof HTMLImageElement &&
        img.complete &&
        img.naturalWidth > 0 &&
        img.naturalHeight > 0
      );
    });
  }

  const FACE_PRELOAD_PROMISE = Promise.all(
    FACES.map(function (face) {
      return preloadImage(
        face.file,
        FACE_IMAGE_CACHE
      );
    })
  ).catch(function (error) {
    console.error(
      '[ATTENTIONAL SHIELD] Human face preload failed:',
      error
    );

    return [];
  });

  /*
   * Unified anime preload gate.
   *
   * Promise.allSettled-style behaviour is achieved by making
   * preloadImage() itself non-rejecting.
   */
  const ANIME_PRELOAD_READY = Promise.all(
    ANIME_MODES.map(async function (mode) {
      if (!ANIME_IMAGE_CACHE[mode]) {
        ANIME_IMAGE_CACHE[mode] =
          Object.create(null);
      }

      const paths =
        ANIME_FACE_ASSET_MANIFEST[mode] ||
        [];

      const results = await Promise.all(
        paths.map(function (path) {
          return preloadImage(
            path,
            ANIME_IMAGE_CACHE[mode]
          );
        })
      );

      return {
        mode: mode,
        loaded: results.filter(Boolean).length
      };
    })
  ).catch(function (error) {
    console.error(
      '[ATTENTIONAL SHIELD] Anime preload pipeline failed:',
      error
    );

    ANIME_MODES.forEach(function (mode) {
      if (!ANIME_IMAGE_CACHE[mode]) {
        ANIME_IMAGE_CACHE[mode] =
          Object.create(null);
      }
    });

    return [];
  });

  const ANIME_FACE_PRELOAD_PROMISES =
    Object.fromEntries(
      ANIME_MODES.map(function (mode) {
        return [
          mode,
          ANIME_PRELOAD_READY.then(function () {
            return getCachedAnimePaths(mode);
          })
        ];
      })
    );

  function createPreloadedFaceImage(
    path,
    altText,
    cache
  ) {
    const cached =
      cache && cache[path]
        ? cache[path]
        : FACE_IMAGE_CACHE[path] || null;

    const img =
      cached instanceof HTMLImageElement
        ? cached.cloneNode(false)
        : new Image();

    img.src = path;
    img.alt = altText || '';
    img.decoding = 'async';
    img.loading = 'eager';
    img.draggable = false;

    img.className =

    /*

    img.style.objectFit = 'cover';

  /* ============================================================
     THREE.JS SPATIAL ENGINE
     ============================================================ */

  const Spatial3D = (function () {

    let container = null;
    let renderer = null;
    let camera = null;
    let scene = null;
    let latticeGroup = null;
    let activeCube = null;

    let animationFrame = null;
    let resizeObserver = null;
    let resizeHandler = null;

    let textureLoader = null;
    let textureRequestId = 0;

    let activeTexture = null;
    let activeMaterials = null;

    let latticeGeometry = null;
    let latticeMaterial = null;

    const CELL_SIZE = 1;
    const GAP = 0.05;
    const SPACING = CELL_SIZE + GAP;

    const GRID_HALF =
      (SPACING * 3) / 2;

    function addSegment(
      vertices,
      ax,
      ay,
      az,
      bx,
      by,
      bz
    ) {
      vertices.push(
        ax, ay, az,
        bx, by, bz
      );
    }

    /*
     * Single consolidated 3×3×3 lattice.
     *
     * Four coordinates per axis give:
     *   - outer boundary
     *   - two internal partitions
     *
     * No 27 overlapping BoxGeometry wireframes.
     */
    function buildUnifiedLatticeGeometry() {
      const vertices = [];
      const h = GRID_HALF;

      const coords = [
        -h,
        -SPACING / 2,
         SPACING / 2,
         h
      ];

      /*
       * X direction.
       */
      for (const y of coords) {
        for (const z of coords) {
          addSegment(
            vertices,
            -h, y, z,
             h, y, z
          );
        }
      }

      /*
       * Y direction.
       */
      for (const x of coords) {
        for (const z of coords) {
          addSegment(
            vertices,
            x, -h, z,
            x,  h, z
          );
        }
      }

      /*
       * Z direction.
       */
      for (const x of coords) {
        for (const y of coords) {
          addSegment(
            vertices,
            x, y, -h,
            x, y,  h
          );
        }
      }

      const geometry =
        new THREE.BufferGeometry();

      geometry.setAttribute(
        'position',
        new THREE.Float32BufferAttribute(
          vertices,
          3
        )
      );

      geometry.computeBoundingSphere();

      return geometry;
    }

    function clearActiveTexture() {
      if (!activeMaterials) return;

      activeMaterials.forEach(function (material) {
        material.map = null;
        material.needsUpdate = true;
      });

      if (activeTexture) {
        activeTexture.dispose();
        activeTexture = null;
      }
    }

    function loadStimulusTexture(path) {
      const requestId =
        ++textureRequestId;

      if (!path || !textureLoader) {
        clearActiveTexture();
        return;
      }

      textureLoader.load(
        path,

        function (texture) {
          if (requestId !== textureRequestId) {
            texture.dispose();
            return;
          }

          if (
            !texture.image ||
            texture.image.width <= 0 ||
            texture.image.height <= 0
          ) {
            texture.dispose();
            console.error(
              'Failed to load anime face path:',
              path
            );
            return;
          }

          if (activeTexture) {
            activeTexture.dispose();
          }

          activeTexture = texture;

          texture.colorSpace =
            THREE.SRGBColorSpace;

          activeMaterials.forEach(
            function (material) {
              material.map = texture;
              material.needsUpdate = true;
            }
          );
        },

        undefined,

        function () {
          if (requestId !== textureRequestId) {
            return;
          }

          console.error(
            'Failed to load anime face path:',
            path
          );
        }
      );
    }

    function resize() {
      if (!renderer || !camera || !container) {
        return;
      }

      const rect =
        container.getBoundingClientRect();

      const width =
        Math.max(1, rect.width);

      const height =
        Math.max(1, rect.height);

      camera.aspect =
        width / height;

      camera.updateProjectionMatrix();

      renderer.setSize(
        width,
        height,
        false
      );
    }

    function init3D(containerElement) {
      if (
        !containerElement ||
        typeof THREE === 'undefined'
      ) {
        console.error(
          '[Spatial3D] Three.js or 3D container unavailable.'
        );

        return false;
      }

      dispose();

      container =
        containerElement;

      scene = new THREE.Scene();

      scene.background = null;

      textureLoader =
        new THREE.TextureLoader();

      renderer =
        new THREE.WebGLRenderer({
          antialias: true,
          alpha: true
        });

      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio || 1,
          2
        )
      );

      renderer.setClearColor(
        0x090d16,
        0
      );

      renderer.domElement.style.width =
        '100%';

      renderer.domElement.style.height =
        '100%';

      renderer.domElement.style.display =
        'block';

      renderer.domElement.style.margin =
        '0 auto';

      container.innerHTML = '';

      container.appendChild(
        renderer.domElement
      );

      camera =
        new THREE.PerspectiveCamera(
          48,
          1,
          0.1,
          100
        );

      /*
       * Symmetrical camera framing.
       */
      camera.position.set(
        3.1,
        2.6,
        4.0
      );

      camera.lookAt(
        0,
        0,
        0
      );

      scene.add(camera);

      latticeGroup =
        new THREE.Group();

      /*
       * Large but still safely framed.
       */
      latticeGroup.scale.setScalar(
        1.35
      );

      scene.add(
        latticeGroup
      );

      latticeGeometry =
        buildUnifiedLatticeGeometry();

      latticeMaterial =
        new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.35
        });

      const lattice =
        new THREE.LineSegments(
          latticeGeometry,
          latticeMaterial
        );

      latticeGroup.add(
        lattice
      );

      /*
       * Active stimulus cube.
       */
      const geometry =
        new THREE.BoxGeometry(
          CELL_SIZE,
          CELL_SIZE,
          CELL_SIZE
        );

      activeMaterials = [
        new THREE.MeshBasicMaterial({
          color: 0xffffff
        }),
        new THREE.MeshBasicMaterial({
          color: 0xffffff
        }),
        new THREE.MeshBasicMaterial({
          color: 0xffffff
        }),
        new THREE.MeshBasicMaterial({
          color: 0xffffff
        }),
        new THREE.MeshBasicMaterial({
          color: 0xffffff
        }),
        new THREE.MeshBasicMaterial({
          color: 0xffffff
        })
      ];

      activeCube =
        new THREE.Mesh(
          geometry,
          activeMaterials
        );

      activeCube.visible =
        false;

      /*
       * Important:
       * No billboarding.
       * No lookAt() every frame.
       * No counter rotation.
       *
       * The cube remains a normal child of the
       * rotating lattice.
       */
      latticeGroup.add(
        activeCube
      );

      resizeHandler =
        resize;

      window.addEventListener(
        'resize',
        resizeHandler
      );

      if (
        typeof ResizeObserver !==
        'undefined'
      ) {
        resizeObserver =
          new ResizeObserver(
            resize
          );

        resizeObserver.observe(
          container
        );
      }

      resize();

      function animate() {
        animationFrame =
          requestAnimationFrame(
            animate
          );

        /*
         * Continuous multi-axis lattice rotation.
         */
        if (latticeGroup) {
          latticeGroup.rotation.x +=
            0.0022;

          latticeGroup.rotation.y +=
            0.005;

          latticeGroup.rotation.z +=
            0.0015;
        }

        renderer.render(
          scene,
          camera
        );
      }

      animate();

      return true;
    }

    function setStimulusPosition(
      index,
      imagePath
    ) {
      if (!activeCube) {
        return false;
      }

      const safeIndex =
        Math.max(
          0,
          Math.min(
            26,
            Math.floor(
              Number(index) || 0
            )
          )
        );

      const x =
        (safeIndex % 3) - 1;

      const y =
        (
          Math.floor(
            safeIndex / 3
          ) % 3
        ) - 1;

      const z =
        Math.floor(
          safeIndex / 9
        ) - 1;

      activeCube.position.set(
        x * SPACING,
        y * SPACING,
        z * SPACING
      );

      /*
       * Native upright cube orientation.
       *
       * It is NOT continuously corrected.
       */
      activeCube.rotation.set(
        0,
        0,
        0
      );

      activeCube.visible =
        true;

      if (imagePath) {
        loadStimulusTexture(
          imagePath
        );
      } else {
        clearActiveTexture();
      }

      return true;
    }

    function clearStimulus() {
      if (activeCube) {
        activeCube.visible =
          false;
      }

      ++textureRequestId;

      clearActiveTexture();
    }

    function dispose() {
      ++textureRequestId;

      if (
        animationFrame !== null
      ) {
        cancelAnimationFrame(
          animationFrame
        );
      }

      animationFrame = null;

      if (resizeObserver) {
        resizeObserver.disconnect();
      }

      resizeObserver = null;

      if (resizeHandler) {
        window.removeEventListener(
          'resize',
          resizeHandler
        );
      }

      resizeHandler = null;

      clearActiveTexture();

      if (activeCube) {
        if (activeCube.geometry) {
          activeCube.geometry.dispose();
        }

        if (
          Array.isArray(
            activeCube.material
          )
        ) {
          activeCube.material.forEach(
            function (material) {
              material.dispose();
            }
          );
        }
      }

      if (latticeGeometry) {
        latticeGeometry.dispose();
        latticeGeometry = null;
      }

      if (latticeMaterial) {
        latticeMaterial.dispose();
        latticeMaterial = null;
      }

      if (renderer) {
        renderer.dispose();

        if (
          renderer.domElement &&
          renderer.domElement.parentNode
        ) {
          renderer.domElement.parentNode.removeChild(
            renderer.domElement
          );
        }
      }

      renderer = null;
      camera = null;
      scene = null;
      latticeGroup = null;
      activeCube = null;
      activeMaterials = null;
      textureLoader = null;
      activeTexture = null;
      container = null;
    }

    return {
      init3D,
      setStimulusPosition,
      clearStimulus,
      dispose
    };

  })();

  /* ============================================================

  class GameEngine {

    constructor() {
      this.reset();

      this.voices = [];
      this.selectedVoice = null;

      this.mode = 'dual';

      this.keys = {
        pos: 'ArrowLeft',
        col: 'ArrowUp',
        aud: 'ArrowRight',
        shp: 'ArrowDown'
      };

      this.listeningBind = null;

      this.activeStimuli = [];

      this.imageCache = {};

      this.imagesLoaded = false;
      this.animeImagesLoaded = false;

      this.stimulusType =
        'human_faces';

      this.animeMode =
        'standard';

      this._preloadPromise = null;

      /*
       * Generation token used to invalidate
       * callbacks belonging to previous trials.
       */
      this._trialGeneration = 0;
    }

    reset() {
      this.trials = [];
      this.kSeq = [];
      this.currentTrial = 0;
      this.blockTrials = 0;

      this.responses = {};
      this.stats = {};

      this.isRunning = false;
      this.isPaused = false;
      this.isTrialActive = false;

      this.sessionStart = 0;
      this.sessionMs = 0;
      this.lastTick = 0;

      this.timerInterval = null;
      this.trialTimeout = null;
      this.trialAdvanceTimeout = null;

      this.currentN = 2;
      this.highestN = 2;

      this._trialGeneration++;
    }

    async preloadImages() {
      if (this._preloadPromise) {
        return this._preloadPromise;
      }

      this._preloadPromise =
        (async () => {
          try {
            await FACE_PRELOAD_PROMISE;

            FACES.forEach(
              function (face) {
                this.imageCache[face.file] =
                  FACE_IMAGE_CACHE[
                    face.file
                  ] instanceof HTMLImageElement;
              }.bind(this)
            );

            await ANIME_PRELOAD_READY;

            const selectedMode =
              ANIME_MODES.includes(
                this.animeMode
              )
                ? this.animeMode
                : 'standard';

            const standardAnime =
              getCachedAnimePaths(
                'standard'
              );

            const selectedAnime =
              getCachedAnimePaths(
                selectedMode
              );

            this.imagesLoaded =
              true;

            this.animeImagesLoaded =
              selectedAnime.length > 0;

            console.info(
              '[ATTENTIONAL SHIELD] Image preload complete:',
              {
                humanFaces:
                  Object.values(
                    this.imageCache
                  ).filter(Boolean).length,

                animeStandard:
                  standardAnime.length,

                selectedAnime:
                  selectedAnime.length,

                selectedMode:
                  selectedMode
              }
            );

            return {
              animeReady:
                this.animeImagesLoaded,

              animeLoaded:
                selectedAnime.length
            };

          } catch (error) {
            /*
             * Optional image failures must never
             * prevent session initialization.
             */
            this.imagesLoaded =
              true;

            this.animeImagesLoaded =
              getCachedAnimePaths(
                this.animeMode
              ).length > 0;

            console.warn(
              '[ATTENTIONAL SHIELD] Non-fatal image preload issue:',
              error
            );

            return {
              animeReady:
                this.animeImagesLoaded,

              animeLoaded:
                getCachedAnimePaths(
                  this.animeMode
                ).length
            };
          }
        })();

      return this._preloadPromise;
    }

    pickFace(emoLoad) {
      const r =
        Math.random() * 100;

      const neg =
        FACES.filter(
          function (f) {
            return f.valence < 0;
          }
        );

      const neu =
        FACES.filter(
          function (f) {
            return f.valence === 0;
          }
        );

      const pos =
        FACES.filter(
          function (f) {
            return f.valence > 0;
          }
        );

      if (r < emoLoad) {
        return neg[
          Math.floor(
            Math.random() *
            neg.length
          )
        ];
      }

      if (
        r <
        emoLoad +
        (100 - emoLoad) * 0.6
      ) {
        return neu[
          Math.floor(
            Math.random() *
            neu.length
          )
        ];
      }

      return pos[
        Math.floor(
          Math.random() *
          pos.length
        )
      ];
    }

    pickAnimeFace(
      mode = this.animeMode
    ) {
      const safeMode =
        ANIME_MODES.includes(mode)
          ? mode
          : 'standard';

      /*
       * CRITICAL:
       * Never return an unverified manifest path.
       */
      const available =
        getCachedAnimePaths(
          safeMode
        );

      if (!available.length) {
        return null;
      }

      return available[
        Math.floor(
          Math.random() *
          available.length
        )
      ];
    }

    pickVisualStimulus(emoLoad) {
      if (
        this.stimulusType ===
        'anime_faces'
      ) {
        const safeMode =
          ANIME_MODES.includes(
            this.animeMode
          )
            ? this.animeMode
            : 'standard';

        const animePath =
          this.pickAnimeFace(
            safeMode
          );

        if (animePath) {
          return {
            type:
              'anime_faces',

            path:
              animePath,

            emotion:
              'anime',

            animeMode:
              safeMode,

            fallbackFromAnime:
              false
          };
        }

        /*
         * Anime assets are optional.
         *
         * Do not throw.
         * Do not fabricate a broken URL.
         *
         * Human face fallback is explicit.
         */
        console.warn(
          '[ATTENTIONAL SHIELD] Anime assets unavailable; using human face fallback for this trial.'
        );

        const face =
          this.pickFace(
            emoLoad
          );

        return {
          type:
            'standard_faces',

          path:
            face.file,

          emotion:
            face.emotion,

          animeMode:
            null,

          fallbackFromAnime:
            true
        };
      }

      const face =
        this.pickFace(
          emoLoad
        );

      return {
        type:
          'standard_faces',

        path:
          face.file,

        emotion:
          face.emotion,

        animeMode:
          null,

        fallbackFromAnime:
          false
      };
    }

    getPosCount() {
      const s =
        this.getSettings();

      return s.gridType === '3d'
        ? 27
        : s.gridSize *
          s.gridSize;
    }

    getSettings() {
      const safeInt =
        function (
          id,
          def
        ) {
          const el =
            document.getElementById(
              id
            );

          return el
            ? (
                parseInt(
                  el.value
                ) || def
              )
            : def;
        };

      const safeBool =
        function (id) {
          const el =
            document.getElementById(
              id
            );

          return el
            ? el.checked
            : false;
        };

      const safeVal =
        function (
          id,
          def
        ) {
          const el =
            document.getElementById(
              id
            );

          return el
            ? el.value
            : def;
        };

      const gridType =
        safeVal(
          'sel-grid-type',
          '2d'
        );

      return {
        gridType,

        gridSize:
          safeInt(
            'sel-grid-size',
            3
          ),

        startN:
          safeInt(
            'rng-start-n',
            2
          ),

        variableN:
          safeBool(
            'chk-variable-n'
          ),

        varMin:
          safeInt(
            'rng-var-min',
            1
          ),

        varMax:
          safeInt(
            'rng-var-max',
            4
          ),

        emoLoad:
          safeInt(
            'rng-emo-load',
            50
          ),

        isiMode:
          safeVal(
            'sel-isi-mode',
            'fixed'
          ),

        isiFixed:
          safeInt(
            'rng-isi-fixed',
            DEFAULT_ISI
          ),

        isiMin:
          safeInt(
            'rng-isi-min',
            1300
          ),

        isiMax:
          safeInt(
            'rng-isi-max',
            3000
          ),

        sessionDuration:
          safeInt(
            'rng-session-duration',
            DEFAULT_SESSION_DURATION_MIN
          ),

        stimDur:
          safeInt(
            'rng-stim-dur',
            TRIAL_TIMING.stimulusMs
          ),

        interference:
          safeInt(
            'rng-interference',
            40
          ),

        matchRate:
          safeInt(
            'rng-match-rate',
            30
          ) / 100,

        speed3d:
          safeInt(
            'rng-3d-speed',
            50
          ),

        stimPos:
          safeBool(
            'chk-pos'
          ),

        stimAud:
          safeBool(
            'chk-aud'
          ),

        stimShp:
          safeBool(
            'chk-shp'
          ),

        stimCol:
          safeBool(
            'chk-col'
          )
      };
    }

    setActiveStimuli() {
      const s =
        this.getSettings();

      this.activeStimuli = [];

      if (s.stimPos) {
        this.activeStimuli.push(
          'pos'
        );
      }

      if (s.stimAud) {
        this.activeStimuli.push(
          'aud'
        );
      }

      if (s.stimShp) {
        this.activeStimuli.push(
          'shp'
        );
      }

      if (s.stimCol) {
        this.activeStimuli.push(
          'col'
        );
      }

      if (
        this.activeStimuli.length ===
        0
      ) {
        this.activeStimuli = [
          'pos'
        ];

        const el =
          document.getElementById(
            'chk-pos'
          );

        if (el) {
          el.checked = true;
        }
      }
    }

    /*
     * Generate one complete block.
     *
     * Anime availability is checked but NEVER causes
     * a fatal exception.
     */
    generateBlock() {
      const s =
        this.getSettings();

      this.blockTrials =
        20 +
        (
          this.currentN *
          this.currentN
        );

      this.kSeq = [];

      const minK =
        s.variableN
          ? s.varMin
          : this.currentN;

      const maxK =
        s.variableN
          ? Math.min(
              s.varMax,
              this.currentN
            )
          : this.currentN;

      for (
        let i = 0;
        i < this.blockTrials;
        i++
      ) {
        let k =
          minK;

        if (
          maxK > minK
        ) {
          k =
            minK +
            Math.floor(
              Math.random() *
              (
                maxK -
                minK +
                1
              )
            );
        }

        this.kSeq.push(
          k
        );
      }

      const positions =
        this.generateSequence(
          this.getPosCount(),
          this.blockTrials,
          s.interference,
          s.matchRate
        );

      this.trials = [];

      for (
        let i = 0;
        i < this.blockTrials;
        i++
      ) {
        const visual =
          this.pickVisualStimulus(
            s.emoLoad
          );

        const trial = {
          pos:
            positions[i],

          col:
            Math.floor(
              Math.random() *
              4
            ),

          shp:
            Math.floor(
              Math.random() *
              4
            ),

          audWord:
            this.pickWord(
              s.emoLoad
            ),

          visualType:
            visual.type,

          face:
            visual.path,

          animeAsset:
            visual.type ===
            'anime_faces'
              ? visual.path
              : null,

          animeMode:
            visual.animeMode ||
            null,

          emotion:
            visual.emotion,

          fallbackFromAnime:
            !!visual.fallbackFromAnime
        };

        this.trials.push(
          trial
        );
      }

      this.activeStimuli.forEach(
        function (type) {
          this.responses[type] =
            Array(
              this.blockTrials
            ).fill(false);

          this.stats[type] = {
            hits: 0,
            misses: 0,
            falseAlarms: 0,
            correctRejects: 0
          };
        }.bind(this)
      );

      return this.trials;
    }

    generateSequence(
      poolSize,
      length,
      interference,
      matchRate
    ) {
      const seq = [];

      const targetRate =
        Math.max(
          0,
          Math.min(
            1,
            Number(matchRate) || 0
          )
        );

      for (
        let i = 0;
        i < length;
        i++
      ) {
        const k =
          this.kSeq[i] ||
          this.currentN;

        let picked =
          null;

        if (
          i >= k &&
          Math.random() <
            targetRate
        ) {
          picked =
            seq[
              i - k
            ];
        }

        if (
          picked === null
        ) {
          const forbidden =
            new Set();

          if (
            i >= k
          ) {
            forbidden.add(
              seq[i - k]
            );
          }

          const avoid =
            new Set(
              forbidden
            );

          if (
            interference <
            0.5
          ) {
            for (
              let lag = 1;
              lag <= 3;
              lag++
            ) {
              if (
                i - lag >= 0
              ) {
                avoid.add(
                  seq[
                    i - lag
                  ]
                );
              }
            }
          }

          let available =
            [];

          for (
            let v = 0;
            v < poolSize;
            v++
          ) {
            if (
              !avoid.has(v)
            ) {
              available.push(
                v
              );
            }
          }

          if (
            available.length ===
            0
          ) {
            for (
              let v = 0;
              v < poolSize;
              v++
            ) {
              if (
                !forbidden.has(v)
              ) {
                available.push(
                  v
                );
              }
            }
          }

          if (
            available.length ===
            0
          ) {
            available =
              Array.from(
                {
                  length:
                    poolSize
                },
                function (
                  _,
                  index
                ) {
                  return index;
                }
              );
          }

          picked =
            available[
              Math.floor(
                Math.random() *
                available.length
              )
            ];
        }

        seq.push(
          picked
        );
      }

      return seq;
    }

    pickWord() {
      const words = [
        'CALM',
        'JOY',
        'ANGER',
        'FEAR',
        'TRUST',
        'LOSS',
        'HOPE',
        'THREAT'
      ];

      return words[
        Math.floor(
          Math.random() *
          words.length
        )
      ];
    }

    getISI() {
      const s =
        this.getSettings();

      if (
        s.isiMode ===
        'fixed'
      ) {
        return Math.max(
          500,
          Math.min(
            5000,
            s.isiFixed
          )
        );
      }

      const min =
        Math.max(
          500,
          Math.min(
            5000,
            s.isiMin
          )
        );

      const max =
        Math.max(
          min,
          Math.min(
            5000,
            s.isiMax
          )
        );

      return Math.round(
        min +
        Math.random() *
        (
          max -
          min
        )
      );
    }
  }

  /* ============================================================
     APP CONTROLLER
     ============================================================ */

  const App = {

    engine:
      new GameEngine(),

    screens: {},

    _initialized:
      false,

    _sessionStartTimeout:
      null,

    _trialToken:
      0,

    init() {
      if (
        this._initialized
      ) {
        return;
      }

      this._initialized =
        true;

      this.screens = {
        setup:
          document.getElementById(
            'screen-setup'
          ),

        game:
          document.getElementById(
            'screen-game'
          ),

        results:
          document.getElementById(
            'screen-results'
          )
      };

      this.bindControls();

      this.buildGrid();

      this.updateGlobalStats();
    },

    bindControls() {
      const bindInput =
        function (
          id,
          event,
          handler
        ) {
          const el =
            document.getElementById(
              id
            );

          if (el) {
            el.addEventListener(
              event,
              handler
            );
          }
        }.bind(this);

      bindInput(
        'sel-grid-type',
        'change',
        function () {
          this.buildGrid();
        }
      );

      /*
       * CRITICAL STATE FIX:
       *
       * Anime card clicks must update the engine itself,
       * not only the CSS active class.
       */
      document
        .querySelectorAll(
          '[data-stimulus-type]'
        )
        .forEach(
          function (card) {
            card.addEventListener(
              'click',
              function () {
                const type =
                  card.dataset
                    .stimulusType;

                if (!type) {
                  return;
                }

                this.engine.stimulusType =
                  type;

                document
                  .querySelectorAll(
                    '[data-stimulus-type]'
                  )
                  .forEach(
                    function (other) {
                      other.classList.toggle(
                        'active',
                        other === card
                      );
                    }
                  );

                /*
                 * Keep state synchronized
                 * before any session starts.
                 */
                if (
                  type ===
                  'anime_faces'
                ) {
                  this.engine.animeMode =
                    'standard';
                }

                console.info(
                  '[ATTENTIONAL SHIELD] Stimulus type:',
                  this.engine.stimulusType
                );
              }.bind(this)
            );
          }.bind(this)
        );
    },

    async startSession() {
      /*
       * Invalidate any previous pending start.
       */
      if (
        this._sessionStartTimeout
      ) {
        clearTimeout(
          this._sessionStartTimeout
        );

        this._sessionStartTimeout =
          null;
      }

      /*
       * PRELOAD FIRST.
       *
       * generateBlock/startBlock cannot execute
       * until this completes.
       */
      try {
        await this.engine.preloadImages();
      } catch (error) {
        /*
         * Defensive final catch.
         */
        console.warn(
          '[ATTENTIONAL SHIELD] Asset preload rejected; continuing with available assets.',
          error
        );

        this.engine.imagesLoaded =
          true;
      }

      /*
       * Re-read the selected visual state
       * AFTER preload.
       */
      const selectedType =
        this.engine.stimulusType;

      const selectedMode =
        this.engine.animeMode;

      if (
        selectedType ===
        'anime_faces'
      ) {
        const available =
          getCachedAnimePaths(
            selectedMode
          );

        if (
          available.length ===
          0
        ) {
          console.warn(
            '[ATTENTIONAL SHIELD] No Anime images were successfully cached. Trials will use the non-fatal human-face fallback.'
          );
        }
      }

      this.engine.setActiveStimuli();

      this.engine.isRunning =
        true;

      this.engine.isPaused =
        false;

      this.engine.currentTrial =
        0;

      this.engine.currentN =
        Math.max(
          1,
          Number(
            this.engine.getSettings()
              .startN
          ) || 2
        );

      this.engine.highestN =
        this.engine.currentN;

      this.engine.sessionMs =
        0;

      this.engine.sessionStart =
        Date.now();

      this.engine.lastTick =
        Date.now();

      this.buildGrid();

      this.switchScreen(
        'game'
      );

      this.showInterMsg(
        'GET READY',
        800
      );

      this._sessionStartTimeout =
        setTimeout(
          function () {
            this._sessionStartTimeout =
              null;

            if (
              !this.engine.isRunning ||
              this.engine.isPaused
            ) {
              return;
            }

            try {
              this.startBlock();
            } catch (error) {
              console.error(
                '[ATTENTIONAL SHIELD] Block initialization failed:',
                error
              );

              /*
               * Last-resort non-fatal recovery.
               */
              if (
                this.engine.stimulusType ===
                'anime_faces'
              ) {
                console.warn(
                  '[ATTENTIONAL SHIELD] Recovering Anime trial using human visual fallback.'
                );
              }

              try {
                this.startBlock();
              } catch (retryError) {
                console.error(
                  '[ATTENTIONAL SHIELD] Session recovery failed:',
                  retryError
                );

                this.endSession(
                  'error'
                );
              }
            }
          }.bind(this),
          850
        );

      this.engine.timerInterval =
        setInterval(
          function () {
            this.updateTimer();
          }.bind(this),
          100
        );
    },

    startBlock() {
      this.engine.generateBlock();

      this.updateHUD();

      this.runTrial();
    },

    /*
     * Race-safe trial loop.
     */
    runTrial() {
      if (
        !this.engine.isRunning ||
        this.engine.isPaused
      ) {
        return;
      }

      const token =
        ++this._trialToken;

      /*
       * Kill previous timers.
       */
      if (
        this.engine.trialTimeout
      ) {
        clearTimeout(
          this.engine.trialTimeout
        );

        this.engine.trialTimeout =
          null;
      }

      if (
        this.engine.trialAdvanceTimeout
      ) {
        clearTimeout(
          this.engine.trialAdvanceTimeout
        );

        this.engine.trialAdvanceTimeout =
          null;
      }

      if (
        this.engine.currentTrial >=
        this.engine.blockTrials
      ) {
        this.evaluateBlock();

        if (
          this.engine.isRunning &&
          !this.engine.isPaused
        ) {
          this.showInterMsg(
            'BLOCK COMPLETE',
            300
          );

          this.engine.trialAdvanceTimeout =
            setTimeout(
              function () {
                if (
                  token !==
                  this._trialToken
                ) {
                  return;
                }

                if (
                  this.engine.isRunning &&
                  !this.engine.isPaused
                ) {
                  this.startBlock();
                }
              }.bind(this),
              350
            );
        }

        return;
      }

      const trial =
        this.engine.trials[
          this.engine.currentTrial
        ];

      const s =
        this.engine.getSettings();

      this.engine.isTrialActive =
        true;

      const targetEl =
        document.getElementById(
          'pos-' +
          trial.pos
        );

      /*
       * Clear old visual state.
       */
      this.clearGrid();

      /*
       * POSITION STIMULUS
       */
      if (
        this.engine.activeStimuli.includes(
          'pos'
        )
      ) {
        const isAnime =
          trial.visualType ===
          'anime_faces';

        const facePath =
          trial.face;

        if (
          s.gridType ===
          '3d'
        ) {
          /*
           * Three.js validates the texture itself.
           */
          Spatial3D.setStimulusPosition(
            trial.pos,
            facePath || null
          );
        } else if (
          targetEl
        ) {
          const cache =
            isAnime
              ? (
                  ANIME_IMAGE_CACHE[
                    trial.animeMode ||
                    'standard'
                  ] || {}
                )
              : this.engine.imageCache;

          const cached =
            facePath
              ? cache[
                  facePath
                ]
              : null;

          const valid =
            cached instanceof
              HTMLImageElement &&
            cached.naturalWidth >
              0 &&
            cached.naturalHeight >
              0;

          const img =
            targetEl.querySelector(
              '.face-img'
            );

          const fallback =
            targetEl.querySelector(
              '.face-fallback'
            );

          if (!valid) {
            if (
              isAnime
            ) {
              console.error(
                'Failed to load anime face path:',
                facePath
              );
            }

            if (img) {
              img.style.display =
                'none';
            }

            if (fallback) {
              fallback.textContent =
                isAnime
                  ? 'ANIME'
                  : 'FACE';

              fallback.style.display =
                'flex';
            }

            targetEl.classList.add(
              'active'
            );
          } else {
            if (fallback) {
              fallback.style.display =
                'none';
            }

            if (img) {
              img.src =
                facePath;

              img.style.width =
                '100%';

              img.style.height =
                '100%';

              img.style.objectFit =
                'cover';

              img.style.display =
                'block';

              img.style.maxWidth =
                '100%';

              img.style.maxHeight =
                '100%';

              img.style.pointerEvents =
                'none';
            }

            targetEl.classList.add(
              'active'
            );
          }
        }
      }

      /*
       * STIMULUS REMOVAL
       */
      this.engine.trialTimeout =
        setTimeout(
          function () {
            if (
              token !==
              this._trialToken
            ) {
              return;
            }

            if (
              !this.engine.isRunning ||
              this.engine.isPaused
            ) {
              return;
            }

            this.clearGrid();

            Spatial3D.clearStimulus();

            this.engine.isTrialActive =
              false;

            /*
             * Move to next trial only once.
             */
            this.engine.trialAdvanceTimeout =
              setTimeout(
                function () {
                  if (
                    token !==
                    this._trialToken
                  ) {
                    return;
                  }

                  if (
                    !this.engine.isRunning ||
                    this.engine.isPaused
                  ) {
                    return;
                  }

                  this.engine.currentTrial++;

                  this.runTrial();
                }.bind(this),
                this.engine.getISI()
              );
          }.bind(this),
          Math.max(
            50,
            Number(
              s.stimDur ||
              TRIAL_TIMING.stimulusMs
            )
          )
        );
    },

    clearGrid() {
      document
        .querySelectorAll(
          '.cell-2d.active'
        )
        .forEach(
          function (el) {
            el.classList.remove(
              'active'
            );
          }
        );

      document
        .querySelectorAll(
          '.face-img'
        )
        .forEach(
          function (img) {
            img.style.display =
              'none';
          }
        );

      document
        .querySelectorAll(
          '.face-fallback'
        )
        .forEach(
          function (el) {
            el.style.display =
              'none';
          }
        );

      Spatial3D.clearStimulus();
    },

    buildGrid() {
      const s =
        this.engine.getSettings();

      const g2d =
        document.getElementById(
          'grid-2d'
        );

      const s3d =
        document.getElementById(
          'scene-3d'
        );

      if (g2d) {
        g2d.classList.remove(
          'active'
        );

        g2d.innerHTML =
          '';
      }

      if (s3d) {
        s3d.classList.remove(
          'active'
        );
      }

      if (
        s.gridType ===
        '3d'
      ) {
        if (s3d) {
          s3d.classList.add(
            'active'
          );

          Spatial3D.init3D(
            s3d
          );
        }

        return;
      }

      if (!g2d) {
        return;
      }

      g2d.classList.add(
        'active'
      );

      const size =
        Math.max(
          1,
          s.gridSize
        );

      g2d.style.gridTemplateColumns =
        'repeat(' +
        size +
        ', 1fr)';

      g2d.style.gridTemplateRows =
        'repeat(' +
        size +
        ', 1fr)';

      for (
        let i = 0;
        i <
        size * size;
        i++
      ) {
        const cell =
          document.createElement(
            'div'
          );

        cell.className =
          'cell-2d';

        cell.id =
          'pos-' +
          i;

        const img =
          document.createElement(
            'img'
          );

        img.className =
          'face-img stimulus-image';

        img.alt =
          '';

        img.style.width =
          '100%';

        img.style.height =
          '100%';

        img.style.objectFit =
          'cover';

        img.style.display =
          'none';

        img.style.maxWidth =
          '100%';

        img.style.maxHeight =
          '100%';

        img.style.pointerEvents =
          'none';

        const fallback =
          document.createElement(
            'div'
          );

        fallback.className =
          'face-fallback';

        fallback.style.display =
          'none';

        cell.appendChild(
          img
        );

        cell.appendChild(
          fallback
        );

        g2d.appendChild(
          cell
        );
      }
    },

    updateTimer() {
      if (
        !this.engine.isRunning ||
        this.engine.isPaused
      ) {
        return;
      }

      const now =
        Date.now();

      this.engine.sessionMs +=
        now -
        this.engine.lastTick;

      this.engine.lastTick =
        now;

      const el =
        document.getElementById(
          'hud-timer'
        );

      if (el) {
        el.textContent =
          this.formatTime(
            this.engine.sessionMs
          );
      }
    },

    formatTime(ms) {
      const total =
        Math.floor(
          ms / 1000
        );

      const minutes =
        Math.floor(
          total / 60
        );

      const seconds =
        total % 60;

      return (
        String(minutes)
          .padStart(2, '0') +
        ':' +
        String(seconds)
          .padStart(2, '0')
      );
    },

    updateHUD() {
      const trial =
        document.getElementById(
          'hud-trial'
        );

      if (trial) {
        trial.textContent =
          (
            this.engine.currentTrial +
            1
          ) +
          ' / ' +
          this.engine.blockTrials;
      }

      const n =
        document.getElementById(
          'hud-nlevel'
        );

      if (n) {
        n.textContent =
          this.engine.currentN +
          '-Back';
      }
    },

    showInterMsg(
      text,
      duration
    ) {
      const el =
        document.getElementById(
          'inter-msg'
        );

      if (!el) {
        return;
      }

      el.textContent =
        text;

      el.classList.add(
        'active'
      );

      setTimeout(
        function () {
          el.classList.remove(
            'active'
          );
        },
        duration
      );
    },

    switchScreen(
      name
    ) {
      Object.keys(
        this.screens
      ).forEach(
        function (key) {
          const screen =
            this.screens[key];

          if (!screen) {
            return;
          }

          screen.classList.toggle(
            'active',
            key === name
          );
        }
      );
    },

    endSession(
      reason
    ) {
      /*
       * Invalidate all pending trial callbacks.
       */
      this._trialToken++;

      this.engine.isRunning =
        false;

      this.engine.isPaused =
        false;

      this.engine.isTrialActive =
        false;

      if (
        this.engine.trialTimeout
      ) {
        clearTimeout(
          this.engine.trialTimeout
        );

        this.engine.trialTimeout =
          null;
      }

      if (
        this.engine.trialAdvanceTimeout
      ) {
        clearTimeout(
          this.engine.trialAdvanceTimeout
        );

        this.engine.trialAdvanceTimeout =
          null;
      }

      if (
        this.engine.timerInterval
      ) {
        clearInterval(
          this.engine.timerInterval
        );

        this.engine.timerInterval =
          null;
      }

      Spatial3D.clearStimulus();

      this.clearGrid();

      if (
        reason ===
        'error'
      ) {
        this.showInterMsg(
          'SESSION ERROR — OPEN CONSOLE',
          1500
        );
      }

      /*
       * Keep the existing application flow here.
       */
      this.switchScreen(
        'results'
      );
    },

    updateGlobalStats() {
      const elTime =
        document.getElementById(
          'stat-total-time'
        );

      const elSess =
        document.getElementById(
          'stat-sessions'
        );

      if (elTime) {
        elTime.textContent =
          '0';
      }

      if (elSess) {
        elSess.textContent =
          '0';
      }
    }
  };

  /*
   * Make App available to existing
   * inline handlers/debugging code.
   */
  window.App =
    App;

  window.Spatial3D =
    Spatial3D;

  window.ANIME_FACE_ASSET_MANIFEST =
    ANIME_FACE_ASSET_MANIFEST;

  window.ANIME_IMAGE_CACHE =
    ANIME_IMAGE_CACHE;

  window.getCachedAnimePaths =
    getCachedAnimePaths;

  window.preloadAnimeImages =
    function () {
      return ANIME_PRELOAD_READY;
    };

  /* ============================================================
     DOM READY
     ============================================================ */

  function boot() {
    try {
      App.init();
    } catch (error) {
      console.error(
        '[ATTENTIONAL SHIELD] Initialization failed:',
        error
      );

      const msg =
        document.getElementById(
          'inter-msg'
        );

      if (msg) {
        msg.textContent =
          'INITIALIZATION ERROR — OPEN CONSOLE';

        msg.classList.add(
          'active'
        );
      }
    }
  }

  if (
    document.readyState ===
    'loading'
  ) {
    document.addEventListener(
      'DOMContentLoaded',
      boot,
      {
        once: true
      }
    );
  } else {
    boot();
  }

})();
</script>
