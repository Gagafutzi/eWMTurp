<script>
/* ============================================================
   ATTENTIONAL SHIELD — ANIME WEBP ASSET PIPELINE
   ============================================================

   Actual repository assets:

     assets/stimuli/anime/a.webp
     assets/stimuli/anime/b.webp
     assets/stimuli/anime/c.webp
     assets/stimuli/anime/d.webp
     assets/stimuli/anime/e.webp
     assets/stimuli/anime/f.webp
     assets/stimuli/anime/g.webp
     assets/stimuli/anime/h.webp
     assets/stimuli/anime/i.webp
     assets/stimuli/anime/j.webp
     assets/stimuli/anime/k.webp
     assets/stimuli/anime/l.webp

   placeholder.txt is intentionally ignored.

   ============================================================ */


/* ==================== ANIME MANIFEST ==================== */

const ANIME_FACE_ASSET_MANIFEST = Object.freeze({

  standard: Object.freeze([
    'assets/stimuli/anime/a.webp',
    'assets/stimuli/anime/b.webp',
    'assets/stimuli/anime/c.webp',
    'assets/stimuli/anime/d.webp',
    'assets/stimuli/anime/e.webp',
    'assets/stimuli/anime/f.webp',
    'assets/stimuli/anime/g.webp',
    'assets/stimuli/anime/h.webp',
    'assets/stimuli/anime/i.webp',
    'assets/stimuli/anime/j.webp',
    'assets/stimuli/anime/k.webp',
    'assets/stimuli/anime/l.webp'
  ]),

  waifu: Object.freeze([]),
  hentai: Object.freeze([]),
  gore: Object.freeze([])

});


/* ==================== ANIME MODES ==================== */

const ANIME_MODES = Object.freeze([
  'standard',
  'waifu',
  'hentai',
  'gore'
]);


/* ==================== IMAGE CACHES ==================== */

const FACE_IMAGE_CACHE =
  Object.create(null);

const ANIME_IMAGE_CACHE =
  Object.create(null);


/*
 * Explicitly initialize every Anime cache bucket
 * before any preload or trial generation occurs.
 */

ANIME_MODES.forEach(mode => {
  ANIME_IMAGE_CACHE[mode] =
    Object.create(null);
});


/* ==================== IMAGE PRELOADER ==================== */

function preloadImage(path, targetCache) {

  return new Promise(resolve => {

    if (
      !path ||
      !targetCache ||
      typeof targetCache !== 'object'
    ) {
      resolve(false);
      return;
    }


    /*
     * Reuse an already successfully decoded image.
     */

    const existing =
      targetCache[path];

    if (
      existing instanceof HTMLImageElement &&
      existing.complete &&
      existing.naturalWidth > 0 &&
      existing.naturalHeight > 0
    ) {
      resolve(true);
      return;
    }


    /*
     * Never retain a failed/stale cache entry.
     */

    delete targetCache[path];


    const img =
      new Image();

    img.decoding = 'async';
    img.loading = 'eager';


    let settled = false;


    const fail = reason => {

      if (settled) {
        return;
      }

      settled = true;

      delete targetCache[path];

      console.error(
        '[ATTENTIONAL SHIELD] Failed to load Anime image:',
        path,
        reason || ''
      );

      resolve(false);
    };


    img.onerror = () => {
      fail('browser image load error');
    };


    img.onload = async () => {

      /*
       * WebP is accepted exactly like PNG/JPG.
       * naturalWidth is the authoritative load check.
       */

      if (
        img.naturalWidth <= 0 ||
        img.naturalHeight <= 0
      ) {
        fail('zero natural dimensions');
        return;
      }


      /*
       * Force the browser to finish decoding before
       * placing the image in the verified cache.
       */

      if (
        typeof img.decode === 'function'
      ) {

        try {

          await img.decode();

        } catch (error) {

          fail(
            `decode failed: ${
              error?.message || error
            }`
          );

          return;
        }
      }


      /*
       * Validate once again after decoding.
       */

      if (
        img.naturalWidth <= 0 ||
        img.naturalHeight <= 0
      ) {
        fail(
          'zero dimensions after decode'
        );

        return;
      }


      if (settled) {
        return;
      }


      settled = true;

      /*
       * ONLY successfully loaded WebP images
       * are stored in the cache.
       */

      targetCache[path] =
        img;

      resolve(true);
    };


    /*
     * Exact repository path.
     */

    img.src = path;

  });

}


/* ==================== CACHE QUERY ==================== */

function getCachedAnimePaths(
  mode = 'standard'
) {

  const safeMode =
    ANIME_MODES.includes(mode)
      ? mode
      : 'standard';


  const cache =
    ANIME_IMAGE_CACHE[safeMode];


  const manifest =
    ANIME_FACE_ASSET_MANIFEST[safeMode] ||
    [];


  if (!cache || !manifest.length) {

    return [];

  }


  /*
   * Return ONLY images that:
   *
   * 1. exist in the manifest
   * 2. exist in the cache
   * 3. are HTMLImageElements
   * 4. completed loading
   * 5. have non-zero natural dimensions
   */

  return manifest.filter(path => {

    const img =
      cache[path];

    return (
      img instanceof HTMLImageElement &&
      img.complete &&
      img.naturalWidth > 0 &&
      img.naturalHeight > 0
    );

  });

}


/* ==================== ANIME PRELOAD ==================== */

const ANIME_PRELOAD_READY =
  Promise.all(

    ANIME_MODES.map(
      async mode => {

        const paths =
          ANIME_FACE_ASSET_MANIFEST[mode] ||
          [];


        if (!ANIME_IMAGE_CACHE[mode]) {

          ANIME_IMAGE_CACHE[mode] =
            Object.create(null);

        }


        if (!paths.length) {

          return {
            mode,
            requested: 0,
            loaded: 0
          };

        }


        const results =
          await Promise.all(

            paths.map(path =>
              preloadImage(
                path,
                ANIME_IMAGE_CACHE[mode]
              )
            )

          );


        const loaded =
          results.filter(Boolean).length;


        console.info(
          `[ATTENTIONAL SHIELD] Anime ${mode}: ${loaded}/${paths.length} WebP images loaded.`
        );


        return {
          mode,
          requested: paths.length,
          loaded
        };

      }

    )

  )
  .catch(error => {

    console.error(
      '[ATTENTIONAL SHIELD] Anime preload pipeline failed:',
      error
    );


    /*
     * Keep all cache buckets valid even if
     * the optional Anime pipeline fails.
     */

    ANIME_MODES.forEach(mode => {

      if (!ANIME_IMAGE_CACHE[mode]) {

        ANIME_IMAGE_CACHE[mode] =
          Object.create(null);

      }

    });


    return [];

  });


/* ==================== PRELOAD PROMISES ==================== */

const ANIME_FACE_PRELOAD_PROMISES =
  Object.fromEntries(

    ANIME_MODES.map(mode => [

      mode,

      ANIME_PRELOAD_READY.then(
        () =>
          getCachedAnimePaths(mode)
      )

    ])

  );


/* ==================== ANIME SELECTION ==================== */

function pickAnimeFace(
  mode = 'standard'
) {

  const safeMode =
    ANIME_MODES.includes(mode)
      ? mode
      : 'standard';


  const cachedPaths =
    getCachedAnimePaths(
      safeMode
    );


  if (!cachedPaths.length) {

    console.error(
      '[ATTENTIONAL SHIELD] No verified Anime WebP images are available:',
      safeMode
    );

    return null;

  }


  const selectedPath =
    cachedPaths[
      Math.floor(
        Math.random() *
        cachedPaths.length
      )
    ];


  /*
   * Final defensive validation.
   */

  const selectedImage =
    ANIME_IMAGE_CACHE[safeMode][
      selectedPath
    ];


  if (
    !(
      selectedImage instanceof HTMLImageElement &&
      selectedImage.complete &&
      selectedImage.naturalWidth > 0 &&
      selectedImage.naturalHeight > 0
    )
  ) {

    console.error(
      'Failed to load anime face path:',
      selectedPath
    );

    return null;

  }


  return selectedPath;

}


/* ==================== PRELOADED IMAGE CREATOR ==================== */

function createPreloadedFaceImage(
  path,
  altText,
  cache
) {

  const cached =
    cache?.[path] ||
    FACE_IMAGE_CACHE[path] ||
    null;


  const img =
    cached instanceof HTMLImageElement
      ? cached.cloneNode(false)
      : new Image();


  img.src =
    path;

  img.alt =
    altText || '';

  img.decoding =
    'async';

  img.loading =
    'eager';

  img.draggable =
    false;

  img.className =
    'stimulus-image';


  /*
   * Full-cell rendering for both human and Anime faces.
   */

  img.style.width =
    '100%';

  img.style.height =
    '100%';

  img.style.display =
    'block';

  img.style.objectFit =
    'cover';

  img.style.maxWidth =
    '100%';

  img.style.maxHeight =
    '100%';

  img.style.pointerEvents =
    'none';


  return img;

}
</script>
